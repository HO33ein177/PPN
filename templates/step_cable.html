{% extends "layout.html" %}
{% block content %}
<div class="container mt-5" dir="rtl">
    <div class="card shadow border-0">
        <div class="card-header bg-dark text-white py-3 text-center">
            <h4 class="mb-0">مشخصات فنی و انتخاب کابل</h4>
        </div>
        <div class="card-body p-4">
            <div class="row g-3 mb-4 bg-light p-3 rounded">
                <div class="col-md-4">
                    <label class="small text-muted">مدل الکتروپمپ</label>
                    <div class="fw-bold">{{ pump.showing_name or '---' }}</div>
                </div>
                <div class="col-md-4">
                    <label class="small text-muted">جریان نامی (A)</label>
                    <div class="fw-bold text-danger">{{ pump.current or '0' }} A</div>
                </div>
                <div class="col-md-4">
                    <label class="small text-muted">مدل پمپ (بدنه)</label>
                    <div class="fw-bold">{{ pump.pump_model or '---' }}</div>
                </div>
            </div>

            <form method="POST">
                <div class="row mb-4 justify-content-center">
                    <div class="col-md-6 text-center">
                        <label class="form-label fw-bold text-primary">فاصله تابلو از چاه (متر):</label>
                        <input type="number" name="panel_distance" class="form-control form-control-lg border-primary text-center" placeholder="فاصله را وارد کنید" required>
                    </div>
                </div>

                <div class="row mb-5 justify-content-center">
                    <div class="col-md-8 text-center">
                        <label class="form-label fw-bold d-block mb-3">نوع راه اندازی:</label>
                        <div class="btn-group w-100">
                            <input type="radio" class="btn-check" name="start_method" id="s1" value="تک ضرب" checked>
                            <label class="btn btn-outline-primary py-3" for="s1">تک ضرب</label>
                            <input type="radio" class="btn-check" name="start_method" id="s2" value="دو ضرب">
                            <label class="btn btn-outline-primary py-3" for="s2">دو ضرب (ستاره-مثلث)</label>
                        </div>
                    </div>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-success btn-lg px-5">محاسبه نهایی</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
