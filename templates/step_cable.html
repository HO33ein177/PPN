{% extends "layout.html" %}
{% block content %}
<div class="container mt-5" dir="rtl">
    <div class="card shadow-lg border-0">
        <div class="card-header bg-dark text-white py-3 text-center">
            <h4 class="mb-0">جزئیات الکتروپمپ و کابل</h4>
        </div>
        <div class="card-body p-4">
            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label class="form-label small text-muted">مدل الکتروپمپ</label>
                    <input type="text" class="form-control bg-light fw-bold text-center" value="{{ pump.showing_name or 'یافت نشد' }}" readonly>
                </div>
                <div class="col-md-4">
                    <label class="form-label small text-muted">توان مصرفی (kW)</label>
                    <input type="text" class="form-control bg-light fw-bold text-center" value="{{ pump.motor_power or '0' }}" readonly>
                </div>
                <div class="col-md-4">
                    <label class="form-label small text-muted">آمپر نامی (A)</label>
                    <input type="text" class="form-control bg-light fw-bold text-center" value="{{ pump.current or '0' }}" readonly>
                </div>
            </div>
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <label class="form-label small text-muted">مدل پمپ</label>
                    <input type="text" class="form-control bg-light fw-bold text-center" value="{{ pump.pump_model or 'N/A' }}" readonly>
                </div>
                <div class="col-md-4">
                    <label class="form-label small text-muted">تعداد طبقات</label>
                    <input type="text" class="form-control bg-light fw-bold text-center" value="{{ pump.pump_no or '0' }}" readonly>
                </div>
                <div class="col-md-4">
                    <label class="form-label small text-muted">تیپ موتور</label>
                    <input type="text" class="form-control bg-light fw-bold text-center" value="{{ pump.motor_model or 'N/A' }}" readonly>
                </div>
            </div>

            <hr class="my-4">

            <form action="{{ url_for('step_cable') }}" method="POST">
                <div class="row mb-4 justify-content-center">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">فاصله تابلو از چاه (متر):</label>
                        <input type="number" name="panel_distance" class="form-control border-primary form-control-lg text-center" value="10" required>
                    </div>
                </div>

                <div class="row mb-5 justify-content-center">
                    <div class="col-md-8 text-center">
                        <label class="form-label fw-bold mb-3 d-block">نوع راه اندازی:</label>
                        <div class="btn-group w-100">
                            <input type="radio" class="btn-check" name="start_method" id="s1" value="تک ضرب" checked>
                            <label class="btn btn-outline-primary py-3" for="s1">تک ضرب(درایو و...)</label>
                            <input type="radio" class="btn-check" name="start_method" id="s2" value="دو ضرب">
                            <label class="btn btn-outline-primary py-3" for="s2">دو ضرب (ستاره-مثلث)</label>
                        </div>
                    </div>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-success btn-lg px-5 shadow">تایید و مشاهده گزارش نهایی</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
