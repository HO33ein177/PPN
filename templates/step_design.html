{% extends "layout.html" %}

{% block title %}نقطه کار سیستم{% endblock %}

{% block content %}
<style>
    /* --- SCALE & ZOOM FIX --- */
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body {
        background: #e3f0ff;
        zoom: 90%;
        -moz-transform: scale(0.9);
        -moz-transform-origin: top center;
        display: flex;
        flex-direction: column;
    }
    main { flex: 1; display: flex; align-items: center; justify-content: center; }

    .design-card {
        max-width: 550px;
        width: 100%;
        background: #ffffff;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        overflow: hidden;
        direction: rtl;
        text-align: right;
    }
    .card-header { background: #f8f9fa; padding: 25px; border-bottom: 1px solid #eee; }
    .input-group-text { min-width: 80px; justify-content: center; }

    @media (max-width: 768px) {
        body, html { overflow: auto; zoom: 100%; -moz-transform: scale(1); }
    }
</style>

<main>
    <div class="design-card">
        <div class="card-header text-center">
            <h3 class="mb-0">نقطه کاری سیستم </h3>
            <p class="text-muted small">نتایج نهایی محاسبات هیدرولیکی</p>
        </div>

        <div class="card-body p-4">
            <form action="{{ url_for('step_design') }}" method="post">
                <div class="mb-4">
                    <label class="form-label fw-bold">دبی مورد نیاز (Q<sub>r</sub>)</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-dark fw-bold">m³/h</span>
                        <input type="text" class="form-control bg-light text-center fw-bold fs-4" value="{{ flow }}" readonly>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">هد کل مورد نیاز (H<sub>r</sub>)</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-dark fw-bold">m</span>
                        <input type="text" class="form-control bg-light text-center fw-bold fs-4" value="{{ head }}" readonly>
                    </div>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg py-3 fw-bold">
                        جستجوی پمپ‌های مناسب <i class="bi bi-search ms-2"></i>
                    </button>
                    <a href="{{ previous_step }}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-right me-2"></i> اصلاح مشخصات لوله‌کشی
                    </a>
                </div>
            </form>
        </div>
    </div>
</main>
{% endblock %}
